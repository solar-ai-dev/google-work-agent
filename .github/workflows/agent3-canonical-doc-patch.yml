name: Agent3 Canonical Doc Patch

on:
  push:
    branches:
      - agent3/runtime-v2-authority-closure-20260821
    paths:
      - .github/workflows/agent3-canonical-doc-patch.yml

permissions:
  contents: write

jobs:
  apply-canonical-patches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent3/runtime-v2-authority-closure-20260821
          fetch-depth: 0
      - name: Apply and verify canonical amendments
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .agent3-canonical-patches/06.patch
          git apply --check .agent3-canonical-patches/07.patch
          git apply --check .agent3-canonical-patches/12.patch
          git apply --check .agent3-canonical-patches/15.patch
          git apply .agent3-canonical-patches/06.patch
          git apply .agent3-canonical-patches/07.patch
          git apply .agent3-canonical-patches/12.patch
          git apply .agent3-canonical-patches/15.patch
          test "$(git hash-object docs/design/06-agent-workflow.md)" = "e3cbb105d96cae089a5c9220abfbd7954ff0b6c6"
          test "$(git hash-object docs/design/07-tool-mcp-internal-interface.md)" = "73f0fad208c591d1390726e46adf1c16564b714c"
          test "$(git hash-object docs/design/12-test-design.md)" = "d02d5d0bd125efc8d4b99ca6c8350de05782bc45"
          test "$(git hash-object docs/design/15-agent-capability-failure-prompt-contract.md)" = "d04d8d53837f0b0272172c904cf92f9ae6cda103"
          rm -rf .agent3-canonical-patches
          rm -f .github/workflows/agent3-canonical-doc-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: apply Runtime V2 A-F canonical amendments"
          git push origin HEAD:agent3/runtime-v2-authority-closure-20260821
