name: Temporary Planning Review Validation

on:
  push:
    branches:
      - wb-planreview-revise-boundary-final
  pull_request:
    branches:
      - main

jobs:
  targeted-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - name: Run Planning Review targeted tests
        run: >-
          python -m pytest
          tests/unit/application/agents/review/test_review_deterministic_operations.py
          tests/unit/adapters/langgraph/test_planning_review_execution.py
