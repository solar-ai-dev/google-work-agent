name: C3 validation

on:
  push:
    branches:
      - refactor/c3-execution-recovery-prep
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: python -m compileall -q src/google_work_agent/application/use_cases/execution_attempt src/google_work_agent/application/use_cases/verification src/google_work_agent/application/use_cases/recovery tests/unit/application/use_cases
      - name: Run isolated C3 tests past known C4 export blocker
        run: |
          python - <<'PY'
          import sys
          import types
          import pytest

          connector_module = types.ModuleType("google_work_agent.ports.connectors")
          connector_module.ConnectorRuntimeHandle = type("ConnectorRuntimeHandle", (), {})
          sys.modules["google_work_agent.ports.connectors"] = connector_module

          raise SystemExit(pytest.main([
              "-q",
              "tests/unit/application/use_cases/test_c3_execution_recovery_verification.py",
              "tests/unit/application/use_cases/test_c3_delivery_outcomes.py",
          ]))
          PY
