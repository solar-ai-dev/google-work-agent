name: C3 validation

on:
  push:
    branches:
      - refactor/c3-execution-recovery-prep
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest ruff
      - run: python -m compileall -q src/google_work_agent/application/use_cases/execution_attempt src/google_work_agent/application/use_cases/verification src/google_work_agent/application/use_cases/recovery tests/unit/application/use_cases
      - run: ruff check src/google_work_agent/application/use_cases/execution_attempt/execute_action.py src/google_work_agent/application/use_cases/verification/verify_action.py tests/unit/application/use_cases/test_c3_execution_recovery_verification.py
      - run: pytest -q tests/unit/application/use_cases/test_c3_execution_recovery_verification.py
