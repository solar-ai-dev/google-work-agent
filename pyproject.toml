[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "google-work-agent"
version = "0.1.0"
description = "Local single-user Google work agent skeleton."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cryptography>=44,<47",
    "fastapi>=0.141,<0.142",
    "keyring>=25.7,<26",
    "langgraph>=1.2.9,<1.3",
    "python-multipart>=0.0.20,<0.1",
    "tzdata>=2025.2",
    "uvicorn>=0.52,<0.53",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["google_work_agent*"]

[tool.setuptools.package-data]
google_work_agent = [
    "adapters/persistence/migrations/*.sql",
    "application/tool_registry/*.json",
    "application/prompt_runtime/*.json",
    "application/prompt_runtime/sources/*.md",
    "adapters/connectors/runtime/*.json",
    "adapters/connectors/google/workspace/mcp_server/*.json",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = [
    "--tb=short",
    "--import-mode=importlib",
    "--strict-config",
    "--strict-markers",
]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = [
    ".venv",
    ".venv-*",
    "build",
    "docs",
    "dist",
    "*.egg-info",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["google_work_agent"]
files = ["src", "tests"]
check_untyped_defs = true
disallow_untyped_defs = true
disallow_any_generics = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
no_implicit_optional = true
strict_equality = true
exclude = [
    "\\.venv",
    "\\.venv-.*",
    "build",
    "dist",
    ".*\\.egg-info",
]
